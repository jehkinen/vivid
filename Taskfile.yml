version: '3'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  check:
    desc: Lint, tests, and production build (CI-style)
    cmds:
      - npm run lint
      - npm run test
      - npm run build

  clean:
    desc: Remove Next.js cache (.next)
    cmds:
      - rm -rf .next

  dev:
    desc: Start Next.js + local reverse proxy
    cmds:
      - sudo -v
      - task: dev:run

  dev:run:
    desc: Start Next.js + proxy (after sudo auth)
    parallel: true
    deps:
      - dev:next
      - dev:proxy

  dev:next:
    desc: Start Next.js dev server
    vars:
      DEV_HOST:
        sh: basename "$PWD" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9-' | sed 's/--*/-/g; s/^-//; s/-$//' | awk '{print $0 ".test"}'
    cmds:
      - echo "Open https://{{.DEV_HOST}}/login"
      - script -q /dev/null npm run dev -- --hostname "{{.DEV_HOST}}" --port 3000

  dev:proxy:
    desc: Start Caddy reverse proxy (vivid.test)
    vars:
      DEV_HOST:
        sh: basename "$PWD" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9-' | sed 's/--*/-/g; s/^-//; s/-$//' | awk '{print $0 ".test"}'
    cmds:
      - sudo pkill -f "caddy run --watch --config Caddyfile" || true
      - DEV_HOST="{{.DEV_HOST}}" DEV_PORT=3000 DEV_HTTPS_PORT=443 sudo -n caddy run --watch --config Caddyfile

  build:
    desc: Build the project for production
    cmds:
      - npm run build

  start:
    desc: Run Next.js in production mode (after task build)
    cmds:
      - npm run start

  test:
    desc: Run tests
    cmds:
      - npm run test

  prisma:generate:
    desc: Generate Prisma Client
    cmds:
      - npm run prisma:generate

  prisma:push:
    desc: Apply Prisma schema to the database
    cmds:
      - npm run prisma:push

  prisma:studio:
    desc: Open Prisma Studio
    cmds:
      - npm run prisma:studio

  vercel:push-env:
    desc: Push variables from .env to the linked Vercel project (see scripts/vercel-push-env.mjs)
    cmds:
      - node scripts/vercel-push-env.mjs

  deploy:
    desc: Sync .env to Vercel and deploy to production
    deps: [vercel:push-env]
    cmds:
      - vercel deploy --prod --yes
